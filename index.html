<!DOCTYPE html>
<html>
<head>
    <title>FlameQibli Adventure</title>

    <style>
        body {
            margin: 0;
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            overflow: hidden;
        }

        h1 {
            margin: 8px;
        }

        #info {
            margin-bottom: 8px;
        }

        canvas {
            border: 3px solid white;
            display: block;
            margin: auto;
            background: #4caf50;
        }
    </style>
</head>

<body>

<h1>🔥 FlameQibli Adventure 🔥</h1>

<div id="info">
    WASD / Arrow Keys to move |
    Score: <span id="score">0</span>
</div>

<canvas id="game" width="900" height="550"></canvas>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");


// ==================================================
// WORLD
// ==================================================

const worldWidth = 2400;
const worldHeight = 1800;


// ==================================================
// DEBUG
// ==================================================

// Change this to true if you want to SEE collision boxes.

const SHOW_HITBOXES = false;


// ==================================================
// PLAYER
// ==================================================

const player = {
    x: 1200,
    y: 900,
    size: 36,
    speed: 5
};


// ==================================================
// PLAYER SPRITE
// ==================================================

const playerImage = new Image();
playerImage.src = "player.png";


// Direction:
// 0 = Down
// 1 = Left
// 2 = Right
// 3 = Up

let currentDirection = 0;

let animationFrame = 0;
let animationTimer = 0;

let isMoving = false;


// ==================================================
// PLAYER HITBOX
// ==================================================

const playerHitbox = {
    offsetX: 8,
    offsetY: 18,
    width: 20,
    height: 17
};


// ==================================================
// CAMERA
// ==================================================

const camera = {
    x: 0,
    y: 0
};


// ==================================================
// CONTROLS
// ==================================================

const keys = {};

document.addEventListener("keydown", function(event) {

    keys[event.key.toLowerCase()] = true;

});

document.addEventListener("keyup", function(event) {

    keys[event.key.toLowerCase()] = false;

});


// ==================================================
// SCORE
// ==================================================

let score = 0;


// ==================================================
// TREES
// ==================================================

const trees = [
    {x: 300, y: 300},
    {x: 500, y: 600},
    {x: 800, y: 350},
    {x: 1600, y: 300},
    {x: 1900, y: 600},
    {x: 2100, y: 1000},
    {x: 500, y: 1300},
    {x: 1000, y: 1500},
    {x: 1700, y: 1450}
];


// ==================================================
// ROCKS
// ==================================================

const rocks = [
    {x: 400, y: 1000},
    {x: 700, y: 1200},
    {x: 1400, y: 400},
    {x: 1800, y: 1100},
    {x: 1200, y: 1400}
];


// ==================================================
// VILLAGE HOUSES
// ==================================================

const houses = [
    {
        x: 850,
        y: 700,
        width: 180,
        height: 130
    },

    {
        x: 1100,
        y: 600,
        width: 180,
        height: 130
    },

    {
        x: 850,
        y: 1000,
        width: 180,
        height: 130
    }
];


// ==================================================
// WATER
// ==================================================

const water = {
    x: 1450,
    y: 700,
    width: 500,
    height: 350
};


// ==================================================
// COIN
// ==================================================

const coin = {
    x: 1400,
    y: 500,
    size: 22
};


// ==================================================
// RECTANGLE COLLISION
// ==================================================

function rectangleCollision(a, b) {

    return (
        a.x < b.x + b.width &&
        a.x + a.width > b.x &&
        a.y < b.y + b.height &&
        a.y + a.height > b.y
    );

}


// ==================================================
// CIRCLE / RECTANGLE COLLISION
// ==================================================

function circleRectangleCollision(circle, rect) {

    const closestX = Math.max(
        rect.x,
        Math.min(circle.x, rect.x + rect.width)
    );

    const closestY = Math.max(
        rect.y,
        Math.min(circle.y, rect.y + rect.height)
    );

    const distanceX = circle.x - closestX;
    const distanceY = circle.y - closestY;

    return (
        distanceX * distanceX +
        distanceY * distanceY
    ) < circle.radius * circle.radius;

}


// ==================================================
// GET PLAYER HITBOX
// ==================================================

function getPlayerHitbox(x, y) {

    return {
        x: x + playerHitbox.offsetX,
        y: y + playerHitbox.offsetY,
        width: playerHitbox.width,
        height: playerHitbox.height
    };

}


// ==================================================
// CHECK IF PLAYER IS BLOCKED
// ==================================================

function isBlocked(newX, newY) {

    const hitbox = getPlayerHitbox(newX, newY);


    // ----------------------------------------------
    // WATER
    // ----------------------------------------------

    if (rectangleCollision(hitbox, water)) {
        return true;
    }


    // ----------------------------------------------
    // HOUSES
    // ----------------------------------------------

    for (const house of houses) {

        const houseHitbox = {
            x: house.x,
            y: house.y,
            width: house.width,
            height: house.height
        };

        if (rectangleCollision(hitbox, houseHitbox)) {
            return true;
        }

    }


    // ----------------------------------------------
    // TREES
    // ----------------------------------------------

    for (const tree of trees) {

        const trunk = {
            x: tree.x - 8,
            y: tree.y,
            width: 16,
            height: 25
        };

        if (rectangleCollision(hitbox, trunk)) {
            return true;
        }

    }


    // ----------------------------------------------
    // ROCKS
    // ----------------------------------------------

    for (const rock of rocks) {

        const rockCircle = {
            x: rock.x,
            y: rock.y,
            radius: 15
        };

        if (circleRectangleCollision(rockCircle, hitbox)) {
            return true;
        }

    }


    return false;

}


// ==================================================
// CHECK IF COIN LOCATION IS VALID
// ==================================================

function isValidCoinPosition(x, y) {

    const coinBox = {
        x: x,
        y: y,
        width: coin.size,
        height: coin.size
    };


    // ----------------------------------------------
    // DON'T SPAWN IN WATER
    // ----------------------------------------------

    if (rectangleCollision(coinBox, water)) {
        return false;
    }


    // ----------------------------------------------
    // DON'T SPAWN INSIDE HOUSES
    // ----------------------------------------------

    for (const house of houses) {

        const houseBox = {
            x: house.x,
            y: house.y,
            width: house.width,
            height: house.height
        };

        if (rectangleCollision(coinBox, houseBox)) {
            return false;
        }

    }


    // ----------------------------------------------
    // DON'T SPAWN ON TREES
    // ----------------------------------------------

    for (const tree of trees) {

        const trunk = {
            x: tree.x - 12,
            y: tree.y - 5,
            width: 24,
            height: 35
        };

        if (rectangleCollision(coinBox, trunk)) {
            return false;
        }

    }


    // ----------------------------------------------
    // DON'T SPAWN ON ROCKS
    // ----------------------------------------------

    for (const rock of rocks) {

        const rockCircle = {
            x: rock.x,
            y: rock.y,
            radius: 20
        };

        if (circleRectangleCollision(rockCircle, coinBox)) {
            return false;
        }

    }


    return true;

}


// ==================================================
// SPAWN COIN
// ==================================================

function spawnCoin() {

    let attempts = 0;

    while (attempts < 100) {

        const newX =
            100 +
            Math.random() *
            (worldWidth - 200);

        const newY =
            100 +
            Math.random() *
            (worldHeight - 200);

        if (isValidCoinPosition(newX, newY)) {

            coin.x = newX;
            coin.y = newY;

            return;

        }

        attempts++;

    }


    // Safe fallback

    coin.x = 200;
    coin.y = 200;

}


// ==================================================
// UPDATE
// ==================================================

function update() {

    let newX = player.x;
    let newY = player.y;

    isMoving = false;


    // ----------------------------------------------
    // UP
    // ----------------------------------------------

    if (keys["w"] || keys["arrowup"]) {

        newY -= player.speed;

        currentDirection = 3;

        isMoving = true;

    }


    // ----------------------------------------------
    // DOWN
    // ----------------------------------------------

    if (keys["s"] || keys["arrowdown"]) {

        newY += player.speed;

        currentDirection = 0;

        isMoving = true;

    }


    // ----------------------------------------------
    // LEFT
    // ----------------------------------------------

    if (keys["a"] || keys["arrowleft"]) {

        newX -= player.speed;

        currentDirection = 1;

        isMoving = true;

    }


    // ----------------------------------------------
    // RIGHT
    // ----------------------------------------------

    if (keys["d"] || keys["arrowright"]) {

        newX += player.speed;

        currentDirection = 2;

        isMoving = true;

    }


    // ==================================================
    // COLLISION
    // ==================================================

    // X movement

    if (!isBlocked(newX, player.y)) {
        player.x = newX;
    }


    // Y movement

    if (!isBlocked(player.x, newY)) {
        player.y = newY;
    }


    // ==================================================
    // WORLD BOUNDARIES
    // ==================================================

    player.x = Math.max(
        0,
        Math.min(
            worldWidth - player.size,
            player.x
        )
    );

    player.y = Math.max(
        0,
        Math.min(
            worldHeight - player.size,
            player.y
        )
    );


    // ==================================================
    // ANIMATION
    // ==================================================

    if (isMoving) {

        animationTimer++;

        if (animationTimer >= 8) {

            animationFrame++;

            animationTimer = 0;

            if (animationFrame >= 4) {
                animationFrame = 0;
            }

        }

    } else {

        animationFrame = 0;
        animationTimer = 0;

    }


    // ==================================================
    // COIN COLLISION
    // ==================================================

    const playerBox =
        getPlayerHitbox(
            player.x,
            player.y
        );

    const coinBox = {
        x: coin.x,
        y: coin.y,
        width: coin.size,
        height: coin.size
    };

    if (rectangleCollision(playerBox, coinBox)) {

        score++;

        document.getElementById("score").textContent = score;

        spawnCoin();

    }


    // ==================================================
    // CAMERA
    // ==================================================

    camera.x =
        player.x -
        canvas.width / 2;

    camera.y =
        player.y -
        canvas.height / 2;


    camera.x = Math.max(
        0,
        Math.min(
            worldWidth - canvas.width,
            camera.x
        )
    );

    camera.y = Math.max(
        0,
        Math.min(
            worldHeight - canvas.height,
            camera.y
        )
    );

}


// ==================================================
// DRAW
// ==================================================

function draw() {

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    // ==================================================
    // GRASS
    // ==================================================

    ctx.fillStyle = "#4caf50";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    // ==================================================
    // GRID
    // ==================================================

    ctx.strokeStyle =
        "rgba(255,255,255,0.08)";

    ctx.lineWidth = 1;


    for (
        let x = -camera.x % 50;
        x < canvas.width;
        x += 50
    ) {

        ctx.beginPath();

        ctx.moveTo(x, 0);

        ctx.lineTo(
            x,
            canvas.height
        );

        ctx.stroke();

    }


    for (
        let y = -camera.y % 50;
        y < canvas.height;
        y += 50
    ) {

        ctx.beginPath();

        ctx.moveTo(0, y);

        ctx.lineTo(
            canvas.width,
            y
        );

        ctx.stroke();

    }


    // ==================================================
    // WATER
    // ==================================================

    ctx.fillStyle = "#2389da";

    ctx.fillRect(
        water.x - camera.x,
        water.y - camera.y,
        water.width,
        water.height
    );


    // ==================================================
    // VILLAGE HOUSES
    // ==================================================
    //
    // IMPORTANT:
    // Houses MUST be drawn inside draw()
    // so they are redrawn every frame.
    //

    for (const house of houses) {

        const x = house.x - camera.x;
        const y = house.y - camera.y;


        // House body

        ctx.fillStyle = "#d88945";

        ctx.fillRect(
            x,
            y,
            house.width,
            house.height
        );


        // Roof

        ctx.fillStyle = "#8b2f2f";

        ctx.beginPath();

        ctx.moveTo(
            x - 15,
            y
        );

        ctx.lineTo(
            x + house.width / 2,
            y - 70
        );

        ctx.lineTo(
            x + house.width + 15,
            y
        );

        ctx.closePath();

        ctx.fill();


        // Door

        ctx.fillStyle = "#5a321f";

        ctx.fillRect(
            x + house.width / 2 - 20,
            y + house.height - 55,
            40,
            55
        );


        // Windows

        ctx.fillStyle = "#72d6ff";

        ctx.fillRect(
            x + 25,
            y + 35,
            35,
            35
        );

        ctx.fillRect(
            x + house.width - 60,
            y + 35,
            35,
            35
        );

    }


    // ==================================================
    // TREES
    // ==================================================

    for (const tree of trees) {

        const x = tree.x - camera.x;
        const y = tree.y - camera.y;


        // Trunk

        ctx.fillStyle = "#7b4a24";

        ctx.fillRect(
            x - 7,
            y,
            14,
            25
        );


        // Leaves

        ctx.fillStyle = "#176b2c";

        ctx.beginPath();

        ctx.arc(
            x,
            y - 5,
            25,
            0,
            Math.PI * 2
        );

        ctx.fill();

    }


    // ==================================================
    // ROCKS
    // ==================================================

    for (const rock of rocks) {

        const x = rock.x - camera.x;
        const y = rock.y - camera.y;

        ctx.fillStyle = "#777";

        ctx.beginPath();

        ctx.arc(
            x,
            y,
            18,
            0,
            Math.PI * 2
        );

        ctx.fill();

    }


    // ==================================================
    // COIN
    // ==================================================

    ctx.fillStyle = "gold";

    ctx.beginPath();

    ctx.arc(
        coin.x -
        camera.x +
        coin.size / 2,

        coin.y -
        camera.y +
        coin.size / 2,

        coin.size / 2,

        0,
        Math.PI * 2
    );

    ctx.fill();


    // ==================================================
    // FLAMEQIBLI SPRITE
    // ==================================================

    const px =
        player.x - camera.x;

    const py =
        player.y - camera.y;


    const cellWidth = 269;
    const cellHeight = 230;

    const gridX = 200;
    const gridY = 230;


    const cellX =
        gridX +
        animationFrame * cellWidth;

    const cellY =
        gridY +
        currentDirection * cellHeight;


    const paddingX = 18;
    const paddingY = 12;


    const sourceX =
        cellX + paddingX;

    const sourceY =
        cellY + paddingY;

    const sourceWidth =
        cellWidth -
        paddingX * 2;

    const sourceHeight =
        cellHeight -
        paddingY * 2;


    ctx.drawImage(

        playerImage,

        sourceX,
        sourceY,

        sourceWidth,
        sourceHeight,

        px - 30,
        py - 65,

        60,
        100

    );


    // ==================================================
    // DEBUG HITBOXES
    // ==================================================

    if (SHOW_HITBOXES) {

        // Player hitbox

        const debugPlayer =
            getPlayerHitbox(
                player.x,
                player.y
            );

        ctx.strokeStyle = "red";
        ctx.lineWidth = 2;

        ctx.strokeRect(
            debugPlayer.x - camera.x,
            debugPlayer.y - camera.y,
            debugPlayer.width,
            debugPlayer.height
        );


        // House hitboxes

        ctx.strokeStyle = "yellow";

        for (const house of houses) {

            ctx.strokeRect(
                house.x - camera.x,
                house.y - camera.y,
                house.width,
                house.height
            );

        }


        // Water hitbox

        ctx.strokeStyle = "cyan";

        ctx.strokeRect(
            water.x - camera.x,
            water.y - camera.y,
            water.width,
            water.height
        );


        // Tree hitboxes

        ctx.strokeStyle = "orange";

        for (const tree of trees) {

            ctx.strokeRect(
                tree.x - 8 - camera.x,
                tree.y - camera.y,
                16,
                25
            );

        }

    }

}


// ==================================================
// GAME LOOP
// ==================================================

function gameLoop() {

    update();

    draw();

    requestAnimationFrame(gameLoop);

}


// ==================================================
// START
// ==================================================

gameLoop();

</script>

</body>
</html>
