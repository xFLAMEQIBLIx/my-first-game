<!DOCTYPE html>
<html>
<head>
    <title>FlameQibli Adventure</title>

    <style>
        body {
            margin: 0;
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            overflow: hidden;
        }

        h1 {
            margin: 8px;
        }

        #info {
            margin-bottom: 8px;
        }

        canvas {
            border: 3px solid white;
            display: block;
            margin: auto;
            background: #4caf50;
        }
    </style>
</head>

<body>

<h1>🔥 FlameQibli Adventure 🔥</h1>

<div id="info">
    WASD / Arrow Keys to move |
    Score: <span id="score">0</span>
</div>

<canvas id="game" width="900" height="550"></canvas>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");


// =============================
// WORLD
// =============================

const worldWidth = 2400;
const worldHeight = 1800;


// =============================
// PLAYER
// =============================

const player = {
    x: 1200,
    y: 900,
    size: 36,
    speed: 5
};


// =============================
// PLAYER SPRITE
// =============================

const playerImage = new Image();
playerImage.src = "player.png";


// Directions:
// 0 = DOWN
// 1 = LEFT
// 2 = RIGHT
// 3 = UP

let currentDirection = 0;

let animationFrame = 0;
let animationTimer = 0;

let isMoving = false;


// =============================
// CAMERA
// =============================

const camera = {
    x: 0,
    y: 0
};


// =============================
// CONTROLS
// =============================

const keys = {};

document.addEventListener("keydown", function(event) {

    keys[event.key.toLowerCase()] = true;

});

document.addEventListener("keyup", function(event) {

    keys[event.key.toLowerCase()] = false;

});


// =============================
// SCORE
// =============================

let score = 0;


// =============================
// OBJECTS
// =============================

const trees = [
    {x: 300, y: 300},
    {x: 500, y: 600},
    {x: 800, y: 350},
    {x: 1600, y: 300},
    {x: 1900, y: 600},
    {x: 2100, y: 1000},
    {x: 500, y: 1300},
    {x: 1000, y: 1500},
    {x: 1700, y: 1450}
];


const rocks = [
    {x: 400, y: 1000},
    {x: 700, y: 1200},
    {x: 1400, y: 400},
    {x: 1800, y: 1100},
    {x: 1200, y: 1400}
];


// =============================
// WATER
// =============================

const water = {
    x: 1450,
    y: 700,
    width: 500,
    height: 350
};


// =============================
// COIN
// =============================

const coin = {
    x: 1400,
    y: 500,
    size: 22
};


// =============================
// COLLISION
// =============================

function rectangleCollision(a, b) {

    return (
        a.x < b.x + b.width &&
        a.x + a.width > b.x &&
        a.y < b.y + b.height &&
        a.y + a.height > b.y
    );

}


function isBlocked(newX, newY) {

    const playerBox = {
        x: newX,
        y: newY,
        width: player.size,
        height: player.size
    };


    // WATER

    if (
        newX < water.x + water.width &&
        newX + player.size > water.x &&
        newY < water.y + water.height &&
        newY + player.size > water.y
    ) {

        return true;

    }


    // TREES

    for (const tree of trees) {

        const treeBox = {
            x: tree.x - 20,
            y: tree.y - 20,
            width: 40,
            height: 40
        };

        if (rectangleCollision(playerBox, treeBox)) {
            return true;
        }

    }


    // ROCKS

    for (const rock of rocks) {

        const rockBox = {
            x: rock.x - 18,
            y: rock.y - 18,
            width: 36,
            height: 36
        };

        if (rectangleCollision(playerBox, rockBox)) {
            return true;
        }

    }

    return false;
}


// =============================
// UPDATE
// =============================

function update() {

    let newX = player.x;
    let newY = player.y;

    isMoving = false;


    // =============================
    // UP
    // =============================

    if (keys["w"] || keys["arrowup"]) {

        newY -= player.speed;

        currentDirection = 3;

        isMoving = true;
    }


    // =============================
    // DOWN
    // =============================

    if (keys["s"] || keys["arrowdown"]) {

        newY += player.speed;

        currentDirection = 0;

        isMoving = true;
    }


    // =============================
    // LEFT
    // =============================

    if (keys["a"] || keys["arrowleft"]) {

        newX -= player.speed;

        currentDirection = 1;

        isMoving = true;
    }


    // =============================
    // RIGHT
    // =============================

    if (keys["d"] || keys["arrowright"]) {

        newX += player.speed;

        currentDirection = 2;

        isMoving = true;
    }


    // =============================
    // COLLISION
    // =============================

    if (!isBlocked(newX, player.y)) {

        player.x = newX;

    }

    if (!isBlocked(player.x, newY)) {

        player.y = newY;

    }


    // =============================
    // WORLD BOUNDARIES
    // =============================

    player.x = Math.max(
        0,
        Math.min(
            worldWidth - player.size,
            player.x
        )
    );

    player.y = Math.max(
        0,
        Math.min(
            worldHeight - player.size,
            player.y
        )
    );


    // =============================
    // ANIMATION
    // =============================

    if (isMoving) {

        animationTimer++;

        if (animationTimer >= 8) {

            animationFrame++;

            animationTimer = 0;

            if (animationFrame >= 4) {

                animationFrame = 0;

            }

        }

    } else {

        animationFrame = 0;

        animationTimer = 0;

    }


    // =============================
    // COIN
    // =============================

    if (
        player.x < coin.x + coin.size &&
        player.x + player.size > coin.x &&
        player.y < coin.y + coin.size &&
        player.y + player.size > coin.y
    ) {

        score++;

        document.getElementById("score").textContent = score;

        coin.x =
            100 +
            Math.random() *
            (worldWidth - 200);

        coin.y =
            100 +
            Math.random() *
            (worldHeight - 200);
    }


    // =============================
    // CAMERA
    // =============================

    camera.x =
        player.x -
        canvas.width / 2;

    camera.y =
        player.y -
        canvas.height / 2;


    camera.x = Math.max(
        0,
        Math.min(
            worldWidth - canvas.width,
            camera.x
        )
    );

    camera.y = Math.max(
        0,
        Math.min(
            worldHeight - canvas.height,
            camera.y
        )
    );

}


// =============================
// DRAW
// =============================

function draw() {

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    // =============================
    // GRASS
    // =============================

    ctx.fillStyle = "#4caf50";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    // =============================
    // GRID
    // =============================

    ctx.strokeStyle =
        "rgba(255,255,255,0.08)";

    ctx.lineWidth = 1;


    for (
        let x = -camera.x % 50;
        x < canvas.width;
        x += 50
    ) {

        ctx.beginPath();

        ctx.moveTo(x, 0);

        ctx.lineTo(
            x,
            canvas.height
        );

        ctx.stroke();

    }


    for (
        let y = -camera.y % 50;
        y < canvas.height;
        y += 50
    ) {

        ctx.beginPath();

        ctx.moveTo(0, y);

        ctx.lineTo(
            canvas.width,
            y
        );

        ctx.stroke();

    }


    // =============================
    // WATER
    // =============================

    ctx.fillStyle = "#2389da";

    ctx.fillRect(
        water.x - camera.x,
        water.y - camera.y,
        water.width,
        water.height
    );


    // =============================
    // TREES
    // =============================

    for (const tree of trees) {

        const x =
            tree.x - camera.x;

        const y =
            tree.y - camera.y;


        // Trunk

        ctx.fillStyle = "#7b4a24";

        ctx.fillRect(
            x - 7,
            y,
            14,
            25
        );


        // Leaves

        ctx.fillStyle = "#176b2c";

        ctx.beginPath();

        ctx.arc(
            x,
            y - 5,
            25,
            0,
            Math.PI * 2
        );

        ctx.fill();

    }


    // =============================
    // ROCKS
    // =============================

    for (const rock of rocks) {

        const x =
            rock.x - camera.x;

        const y =
            rock.y - camera.y;


        ctx.fillStyle = "#777";

        ctx.beginPath();

        ctx.arc(
            x,
            y,
            18,
            0,
            Math.PI * 2
        );

        ctx.fill();

    }


    // =============================
    // COIN
    // =============================

    ctx.fillStyle = "gold";

    ctx.beginPath();

    ctx.arc(
        coin.x -
            camera.x +
            coin.size / 2,

        coin.y -
            camera.y +
            coin.size / 2,

        coin.size / 2,

        0,
        Math.PI * 2
    );

    ctx.fill();


    // =============================
    // FLAMEQIBLI SPRITE
    // =============================

    const px =
        player.x - camera.x;

    const py =
        player.y - camera.y;


    /*
        The new sprite sheet has:

        4 columns = animation frames
        4 rows    = directions

        Row 0 = Down
        Row 1 = Left
        Row 2 = Right
        Row 3 = Up
    */


// =============================
// FLAMEQIBLI SPRITE
// =============================

// Exact grid positions from the sprite sheet
const frameX = [
    199,
    478,
    758,
    1018
];

const frameY = [
    233,
    464,
    690,
    916
];

const frameWidths = [
    279,
    280,
    260,
    254
];

const frameHeights = [
    231,
    226,
    226,
    232
];


// Pick the current frame
const sourceX = frameX[animationFrame];
const sourceY = frameY[currentDirection];

const sourceWidth = frameWidths[animationFrame];
const sourceHeight = frameHeights[currentDirection];


// Leave the grid borders out
const cropX = sourceX + 25;
const cropY = sourceY + 5;
const cropWidth = sourceWidth - 50;
const cropHeight = sourceHeight - 10;


// Draw FlameQibli
ctx.drawImage(
    playerImage,

    cropX,
    cropY,
    cropWidth,
    cropHeight,

    px - 30,
    py - 65,
    60,
    100
);
}


// =============================
// GAME LOOP
// =============================

function gameLoop() {

    update();

    draw();

    requestAnimationFrame(
        gameLoop
    );

}


// =============================
// START GAME
// =============================

gameLoop();

</script>

</body>
</html>
